[project]
name = "asistencia-qr"
version = "0.1.0"
description = "Sistema de control de asistencia por QR (Programación III)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
